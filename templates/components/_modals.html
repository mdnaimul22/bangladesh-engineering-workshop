{# ── Modal Macros ──────────────────────────────────────────── #}

{% macro preview_modal() %}
<div x-data="previewModal()" x-show="open" x-cloak
     class="fixed inset-0 z-[var(--z-modal)] flex items-center justify-center p-4"
     @keydown.escape.window="close()">
    {# Backdrop #}
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="close()"></div>
    {# Modal #}
    <div class="relative bg-[var(--color-surface)] rounded-xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden border border-[var(--color-border)]"
         x-transition>
        {# Header #}
        <div class="flex justify-between items-center px-6 py-4 border-b border-[var(--color-border)]">
            <h3 class="text-lg font-semibold text-[var(--color-text)] m-0" x-text="title"></h3>
            <div class="flex items-center gap-2">
                <a :href="url" target="_blank"
                   class="text-sm text-[var(--color-primary)] hover:underline flex items-center gap-1">
                    <span class="material-icons text-base">open_in_new</span>
                    {{ _('View Full') }}
                </a>
                <button @click="close()"
                        class="p-1 rounded-full hover:bg-[var(--color-bg)] text-[var(--color-text-muted)]"
                        aria-label="{{ _('Close') }}">
                    <span class="material-icons">close</span>
                </button>
            </div>
        </div>
        {# Body #}
        <div class="flex-1 overflow-auto p-4 flex items-center justify-center bg-[var(--color-bg)]">
            <template x-if="isPdf">
                <iframe :src="url" class="w-full h-[75vh] rounded border-0"></iframe>
            </template>
            <template x-if="!isPdf">
                <img :src="url" :alt="title" class="max-w-full max-h-[75vh] object-contain rounded">
            </template>
        </div>
    </div>
</div>
{% endmacro %}

{% macro confirm_modal() %}
<div x-show="$store.confirm.open" x-cloak
     class="fixed inset-0 z-[var(--z-modal)] flex items-center justify-center p-4"
     @keydown.escape.window="$store.confirm.cancel()">
    <div class="absolute inset-0 bg-black/50" @click="$store.confirm.cancel()"></div>
    <div class="relative bg-[var(--color-surface)] rounded-lg shadow-xl w-full max-w-md p-6 border border-[var(--color-border)]"
         x-transition>
        <p class="text-[var(--color-text)] mb-4" x-text="$store.confirm.message"></p>
        <div class="flex justify-end gap-3">
            <button @click="$store.confirm.cancel()"
                    class="px-4 py-2 text-sm rounded-[var(--radius-sm)] bg-[var(--color-bg)] text-[var(--color-text-muted)] hover:bg-[var(--color-border)]">
                {{ _('Cancel') }}
            </button>
            <button @click="$store.confirm.accept()"
                    class="px-4 py-2 text-sm rounded-[var(--radius-sm)] bg-[var(--color-btn-danger)] text-white hover:opacity-90">
                {{ _('Confirm') }}
            </button>
        </div>
    </div>
</div>
{% endmacro %}
