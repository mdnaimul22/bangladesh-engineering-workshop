{# ── Data Table Macro ───────────────────────────────────────── #}

{% macro data_table(headers=[], class_extra='') %}
<div class="overflow-x-auto rounded-[var(--radius)] border border-[var(--color-border)] shadow-sm bg-[var(--color-surface)]">
    <table class="shops-table w-full border-collapse text-sm {{ class_extra }}">
        <thead>
            <tr class="bg-[var(--color-bg)]">
                {% for h in headers %}
                <th class="px-4 py-3 text-left text-xs font-semibold text-[var(--color-text-muted)] uppercase tracking-wider border-b border-[var(--color-border)] {% if h.align %}text-{{ h.align }}{% endif %}">
                    {{ h.label }}
                </th>
                {% endfor %}
            </tr>
        </thead>
        <tbody class="divide-y divide-[var(--color-border)]">
            {{ caller() }}
        </tbody>
    </table>
</div>
{% endmacro %}
